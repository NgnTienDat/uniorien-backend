services:
  postgres:
    image: postgres:17-alpine
    container_name: uniorien-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - uniorien-network

  backend:
    image: tiendat964/uniorien-backend:1.0.0
    container_name: uniorien-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    networks:
      - uniorien-network

networks:
  uniorien-network:
    driver: bridge
