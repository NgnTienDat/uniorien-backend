name: Backend CI/CD - Uniorien

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master

jobs:
  # --- GIAI ĐOẠN 1: CHẠY TEST (CI) ---
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'        # Cập nhật đúng bản 21 bạn yêu cầu
          distribution: 'temurin'   # Bản phân phối ổn định nhất hiện nay
          cache: maven

      - name: Run Tests with Maven
        run: mvn test               # Sẽ tự động tìm thấy UserControllerTest.java

  # --- GIAI ĐOẠN 2: BUILD VÀ PUSH DOCKER ---
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build \
            -t tiendat964/uniorien-backend:latest \
            -t tiendat964/uniorien-backend:$IMAGE_TAG \
            .

      - name: Push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker push tiendat964/uniorien-backend:$IMAGE_TAG
          docker push tiendat964/uniorien-backend:latest
  

  # --- GIAI ĐOẠN 3: DEPLOY (CD) ---
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/uniorien
            docker pull tiendat964/uniorien-backend:latest
            docker compose -f docker-compose.production.yml up -d backend
            docker image prune -f
